name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests scripts function_app.py
      - run: python -m pytest
      - run: pip-audit -r requirements.txt --disable-pip
      - run: python scripts/check_contract.py
      - run: python scripts/build.py
      - name: Verify isolated production artifact
        run: |
          python -m venv "$RUNNER_TEMP/production"
          "$RUNNER_TEMP/production/bin/python" -m pip install --require-hashes -r build/function/requirements.txt
          cd build/function
          APP_ROLE=api "$RUNNER_TEMP/production/bin/python" -c "import function_app; assert len(function_app.app.get_functions()) == 1"
          APP_ROLE=worker "$RUNNER_TEMP/production/bin/python" -c "import function_app; assert len(function_app.app.get_functions()) == 2"
      - uses: actions/upload-artifact@v4
        with:
          name: azure-function-source
          path: build/
          retention-days: 7
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test
