name: Deploy Azure
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-azure
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, azure-private]
    environment: azure
    timeout-minutes: 60
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: 'false'
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify source before deployment
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          ruff check app tests scripts function_app.py
          python -m pytest
          python scripts/check_contract.py
          python scripts/build.py
      - name: Write reviewed environment configuration
        env:
          TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
          TF_BACKEND_HCL: ${{ vars.TF_BACKEND_HCL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          values = json.loads(os.environ['TF_VARS_JSON'])
          Path('terraform/deploy.auto.tfvars.json').write_text(json.dumps(values))
          Path('terraform/backend.hcl').write_text(os.environ['TF_BACKEND_HCL'])
          PY
      - name: Apply infrastructure
        run: |
          terraform -chdir=terraform init -backend-config=backend.hcl -lockfile=readonly
          terraform -chdir=terraform validate
          terraform -chdir=terraform plan -out=deploy.tfplan
          terraform -chdir=terraform apply deploy.tfplan
      - name: Resolve app names
        id: apps
        run: |
          terraform -chdir=terraform output -json function_names > build/function-names.json
          python - <<'PY'
          import json, os
          names = json.load(open('build/function-names.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in names.items():
                  print(f'{key}={value}', file=out)
          PY
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.apps.outputs.api }}
          package: build/function
          remote-build: true
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.apps.outputs.worker }}
          package: build/function
          remote-build: true
      - name: Record artifact digest
        run: python -c "import json; print(json.load(open('build/manifest.json'))['zip_sha256'])"
      - name: Remove runner configuration files
        if: always()
        run: rm -f terraform/deploy.auto.tfvars.json terraform/backend.hcl terraform/deploy.tfplan
